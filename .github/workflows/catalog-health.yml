name: Catalog source health

# Runs every importer against its live source in a temporary sandbox. A failed
# run means a manufacturer or NRCan source changed shape and its importer needs
# review; stale snapshots need an explicit refresh. Tracked data is not changed.
on:
  schedule:
    - cron: '41 13 * * 2'
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated importer names (blank for all)
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-health
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Import live sources and check snapshot age
        env:
          ONLY: ${{ inputs.only }}
        run: >
          npm run catalog:health -- --live --fail-on-stale --report data/tmp/catalog-health.json
          ${ONLY:+--only "$ONLY"}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: catalog-health
          path: data/tmp/catalog-health.json
          retention-days: 30
